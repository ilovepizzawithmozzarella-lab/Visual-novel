<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Incontro clandestino</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#game{position:relative;width:100%;height:100dvh;max-width:900px;margin:auto;overflow:hidden;background:#111}#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 42%,rgba(0,0,0,.64) 100%);pointer-events:none}#box{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));background:rgba(8,9,14,.88);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 13px;z-index:2;max-height:40%;overflow:auto;backdrop-filter:blur(5px)}#box.hidden{display:none}#name{font-weight:750;color:#ffd6df;margin-bottom:5px;font-size:15px}#name.hidden{display:none}#text{font-size:15px;line-height:1.45;white-space:pre-line}#choices{display:grid;gap:7px;margin-top:10px}.choice{width:100%;border:0;border-radius:10px;padding:10px 11px;font-size:14px;font-weight:650;background:#f1f2f4;color:#1678c8;min-height:42px}.choice:active{transform:scale(.98)}#continue{display:block;margin:8px 0 0 auto;border:0;background:transparent;color:#aaa;font-size:12px;padding:2px 0}#round{position:absolute;top:12px;left:12px;z-index:3;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.48);font-size:11px;font-weight:700;display:none}#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:rgba(0,0,0,.12)}#start.hidden{display:none;pointer-events:none}#start button{border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;background:#f2f2f4;color:#147bd1;box-shadow:0 4px 18px rgba(0,0,0,.2)}@media(max-height:650px){#box{max-height:44%;padding:9px 11px}#text{font-size:14px}.choice{min-height:38px;padding:8px 10px}}</style></head>
<body><div id="game"><img id="scene" src="Intro%20.PNG" alt=""><div id="shade"></div><div id="round">ROUND 1</div><div id="box" class="hidden"><div id="name"></div><div id="text"></div><div id="choices"></div><button id="continue">Tocca per continuare ▶</button></div><div id="start"><button id="startButton">Inizia</button></div></div>
<script>
const imgs={intro:'Intro%20.PNG',idle:'Idle.PNG',attack1:'Attacco%201.PNG',attack2:'Attacco%202.PNG',attack3:'Attacco%203.PNG',uppercut:'Montante%20.PNG',down:'A%20terra%20.PNG',getup:'Rialzato.PNG',pause:'Pausa.PNG'};
const scene=document.getElementById('scene'),nameEl=document.getElementById('name'),textEl=document.getElementById('text'),choicesEl=document.getElementById('choices'),box=document.getElementById('box'),start=document.getElementById('start'),startButton=document.getElementById('startButton'),continueBtn=document.getElementById('continue'),roundEl=document.getElementById('round');
const story=[
{img:'intro',text:'Mika aveva vent’anni. Studiava durante la settimana e lavorava qualche ora in un piccolo bar. Era una ragazza tranquilla, non abituata a cercare guai e ancora meno a salire su un ring.',next:1},
{img:'intro',speaker:'Mika',text:'“Quando mi hanno parlato di quei soldi ho pensato che fosse troppo bello per essere vero.”',next:2},
{img:'intro',text:'Aveva accettato perché in casa si erano accumulate alcune spese e il suo stipendio non bastava. Le avevano promesso una cifra che, per una sera soltanto, valeva più di molte settimane di lavoro.',next:3},
{img:'intro',speaker:'Mika',text:'“Mi avevano detto che avrei affrontato una ragazza o comunque qualcuno con poca esperienza. Non un professionista.”',next:4},
{img:'intro',text:'La scoperta era arrivata quando ormai era troppo tardi per fingere di non aver capito. Dall’altra parte del ring c’era Luca, professionista con anni di allenamento alle spalle.',next:5},
{img:'intro',speaker:'Mika',text:'“Quindi… dovrei combattere contro di lui?”',choices:[['“Puoi ancora tirarti indietro.”',6],['“Ti avevano nascosto che fosse un professionista?”',7]]},
{img:'intro',speaker:'Mika',text:'“Lo so. Ma ho bisogno del compenso. Se me ne vado adesso, torno a casa senza niente.”',next:8},
{img:'intro',speaker:'Mika',text:'“Sì. Me ne sono accorta solo quando sono arrivata qui.” Mika abbassò gli occhi. “A quel punto avevo già accettato.”',next:8},
{img:'idle',text:'Mika salì sul ring. Il modo in cui guardava i guantoni e le corde lasciava capire che tutto era nuovo per lei. Fece un respiro profondo e si portò le mani davanti al volto.',next:9},
{img:'idle',speaker:'Luca',text:'“Sei ancora sicura?”',choices:[['“Combatterò seriamente.”',10],['“Non devi dimostrare niente.”',11],['“Sei sicura di riuscire a reggere?”',12]]},
{img:'idle',speaker:'Mika',text:'“Sì. È quello che mi aspettavo quando ho accettato.”',next:13},
{img:'idle',speaker:'Mika',text:'“Forse no. Ma ormai sono qui.” Mika sorrise nervosamente. “Preferisco provarci.”',next:13},
{img:'idle',speaker:'Mika',text:'“Non lo so.” Mika strinse i guantoni. “Ma non voglio scappare.”',next:13},
{img:'idle',text:'Il gong suonò. Mika fece un piccolo passo verso il centro. Io alzai la guardia e la osservai.',next:14},
{img:'idle',speaker:'Luca',text:'“È una principiante. Devo solo capire quanto è inesperta.”',next:15},
{img:'idle',text:'Per qualche secondo nessuno dei due attaccò. Mika si muoveva con cautela, spostando il peso da un piede all’altro.',next:16},
{img:'idle',speaker:'Mika',text:'“Non riesco a capire quando entrerai.”',next:17},
{img:'idle',text:'La guardai muoversi. Non aveva il modo di stare sul ring di una pugile esperta. Era rigida, esitava prima di ogni passo e controllava continuamente la distanza.',next:18},
{img:'idle',speaker:'Luca',text:'“Dovrebbe essere facile.”',next:19},
{img:'idle',text:'Eppure quella sicurezza durò poco. Mika non si precipitava. Aspettava. Per una ragazza che non aveva mai combattuto, stava cercando di capire il ritmo invece di buttarsi avanti alla cieca.',next:20},
{img:'idle',speaker:'Mika',text:'“Forse devo solo aspettare il momento giusto.”',choices:[['“Prenditi il tempo che ti serve.”',21],['“Non pensare troppo. Muoviti.”',22],['“Continua a osservare.”',23]]},
{img:'idle',speaker:'Mika',text:'“Va bene.” Mika rallentò il respiro.',next:24},
{img:'idle',speaker:'Mika',text:'“Ci sto provando.” Fece un altro passo, questa volta senza fermarsi a metà.',next:24},
{img:'idle',speaker:'Mika',text:'Mika annuì. Non disse altro e continuò a seguire i miei piedi.',next:24},
{img:'idle',text:'Passarono alcuni secondi. Mika cominciava a muoversi con meno esitazione. Non era diventata improvvisamente brava, ma aveva smesso di sembrare completamente fuori posto.',next:25},
{img:'idle',speaker:'Luca',text:'“Sta imparando.”',next:26},
{img:'idle',text:'La cosa mi infastidì più di quanto avrei voluto ammettere. Non perché stesse facendo qualcosa di straordinario. Proprio il contrario: stava imparando durante l’incontro, davanti a me.',next:27},
{img:'attack3',speaker:'Mika',text:'Mika avanzò con un diretto. Mi spostai di lato e il suo guantone sfiorò la mia guardia.',choices:[['“Schivo e rispondo.”',28],['“Chiudo la guardia.”',29],['“Vado incontro al colpo.”',30]]},
{img:'attack2',speaker:'Luca',text:'Mi spostai lateralmente. Il pugno passò davanti a me. Provai subito a rispondere, ma Mika si era già rimessa in guardia.',next:31},
{img:'attack2',speaker:'Luca',text:'Alzai la guardia e lasciai che il colpo finisse sui guantoni. Non era potente, ma mi costrinse comunque a fermarmi.',next:31},
{img:'attack3',speaker:'Luca',text:'Entrai nella sua traiettoria prima che potesse completare il colpo. Per un istante ci trovammo molto vicini.',next:31},
{img:'idle',speaker:'Luca',text:'“Mi ha costretto a reagire.”',next:32},
{img:'idle',text:'Mika arretrò di un passo. La vidi respirare più velocemente, ma non sembrava più paralizzata dalla paura.',next:33},
{img:'idle',speaker:'Mika',text:'“Ci sono andata vicina.”',next:34},
{img:'idle',speaker:'Luca',text:'“Troppo vicina.”',next:35},
{img:'idle',text:'Mika mi guardò per un istante. Sembrava quasi sorpresa dalla mia reazione.',next:36},
{img:'idle',speaker:'Mika',text:'“Scusa. Non volevo prenderti alla sprovvista.”',next:37},
{img:'idle',speaker:'Luca',text:'“Non scusarti.”',next:38},
{img:'idle',text:'Tornai in guardia. Il problema era proprio quello: mi aveva sorpreso. E io ero un professionista.',next:39},
{img:'idle',speaker:'Luca',text:'“Non posso farmi sorprendere da una ragazza che non ha mai combattuto.”',next:40},
{img:'idle',text:'Per qualche secondo restammo immobili. Sentivo il rumore dei passi fuori dal ring e il mio stesso respiro dentro i guantoni.',next:41},
{img:'idle',speaker:'Mika',text:'“Posso farcela se continuo a non avere fretta.”',next:42},
{img:'idle',text:'Quelle parole mi fecero sollevare lo sguardo. Non le aveva dette per provocarmi. Sembrava quasi che stesse parlando a se stessa.',next:43},
{img:'idle',speaker:'Luca',text:'“Non darle troppa fiducia.”',next:44},
{img:'idle',text:'Feci un passo avanti. Mika arretrò, poi tornò immediatamente al centro. Non volevo lasciarle il tempo di abituarsi ancora.',next:45},
{img:'uppercut',speaker:'Mika',text:'Mika abbassò leggermente il corpo e partì con un montante.',choices:[['“Paro il montante.”',46],['“Schivo all’indietro.”',47],['“Resto dentro e provo a interromperla.”',48]]},
{img:'uppercut',speaker:'Luca',text:'Chiusi la guardia. Il montante colpì i guantoni e mi fece arretrare.',next:49},
{img:'attack2',speaker:'Luca',text:'Arretrai rapidamente. Il pugno passò davanti a me.',next:49},
{img:'uppercut',speaker:'Luca',text:'Rimasi vicino. Provai a fermare il movimento prima che il pugno arrivasse completamente.',next:49},
{img:'idle',text:'Mika tornò in guardia. Il suo respiro era più pesante, ma gli occhi erano diversi da qualche minuto prima.',next:50},
{img:'idle',speaker:'Mika',text:'“Non pensavo di riuscire a colpirti.”',next:51},
{img:'idle',speaker:'Luca',text:'“Neanch’io pensavo che ci saresti riuscita.”',next:52},
{img:'idle',text:'Mi accorsi subito di averlo detto ad alta voce. Mika rimase sorpresa, poi abbassò per un attimo lo sguardo.',next:53},
{img:'idle',speaker:'Mika',text:'“Allora… forse non sto facendo tutto così male.”',next:54},
{img:'idle',speaker:'Luca',text:'“Non montarti la testa.”',next:55},
{img:'idle',text:'Avrei voluto essere più tranquillo. Invece sentivo crescere una tensione che non aveva nulla a che vedere con la fatica fisica.',next:56},
{img:'idle',speaker:'Luca',text:'“Se continuo a darle spazio, finirò per rendere questo incontro molto più difficile di quanto dovrebbe essere.”',next:57},
{img:'idle',text:'Mika fece un passo avanti. Per un attimo sembrò quasi dimenticare di essere intimorita.',next:58},
{img:'idle',speaker:'Mika',text:'“Posso ancora continuare.”',next:59},
{img:'idle',text:'La campanella era ancora lontana. Io avevo già iniziato a pensare a come chiudere il round senza concederle altre occasioni.',next:60},
{img:'idle',speaker:'Luca',text:'“Non posso permettermi un altro errore.”',choices:[['“Prendo il centro del ring.”',61],['“Resto prudente e aspetto.”',62],['“La provoco per farla uscire dalla guardia.”',63]]},
{img:'attack1',speaker:'Luca',text:'Presi il centro del ring e avanzai. Mika arretrò, poi provò a rientrare.',next:64},
{img:'idle',speaker:'Luca',text:'Rimasi prudente. Non avevo intenzione di regalarle un’altra occasione dopo essere stato sorpreso.',next:64},
{img:'idle',speaker:'Luca',text:'“Se vuoi colpirmi, devi venire a prenderti il rischio.”',next:64},
{img:'idle',speaker:'Mika',text:'Mika strinse i guantoni. “Va bene.”',next:65},
{img:'idle',text:'La vidi fare un passo in avanti. Non era sicura di sé come una pugile esperta. Era più semplice: aveva capito che poteva provarci.',next:66},
{img:'idle',speaker:'Luca',text:'“È questo che mi preoccupa.”',next:67},
{img:'idle',text:'Il gong suonò. Mika tornò verso il suo angolo. Io rimasi fermo qualche secondo prima di abbassare i guantoni.',next:68},
{img:'idle',text:'Mika si sedette e prese fiato. Aveva ancora le mani leggermente tremanti, ma sorrideva appena.',next:69},
{img:'pause',speaker:'Mika',text:'“Non pensavo che sarei riuscita ad arrivare fino alla fine del round.”',next:70},
{img:'pause',speaker:'Luca',text:'“Io invece pensavo che sarebbe stato molto più semplice.”',next:71},
{img:'pause',text:'Rimasi in silenzio. Avevo combattuto contro avversari molto più esperti di Mika e non avevo mai avuto motivo di sentirmi così sotto pressione dopo un solo round.',next:72},
{img:'pause',speaker:'Luca',text:'“È una principiante. E sono io quello che deve trovare un modo per fermarla.”',next:73},
{img:'pause',speaker:'Mika',text:'“Nel secondo round proverò a muovermi di più.”',next:74},
{img:'pause',text:'Mika si alzò lentamente. Quando tornò verso il ring non sembrava più soltanto una ragazza che aveva accettato un incontro per soldi. Aveva ancora paura, ma adesso sapeva di poter restare in piedi davanti a me.',next:75},
{img:'idle',text:'Il secondo round stava per iniziare.',choices:[['Continuare la storia',()=>location.reload()]]}
];
function render(i){const s=story[i];scene.src=imgs[s.img];nameEl.textContent=s.speaker||'';nameEl.classList.toggle('hidden',!s.speaker);textEl.textContent=s.text;choicesEl.innerHTML='';box.classList.remove('hidden');roundEl.style.display=(s.img==='intro'||s.img==='pause')?'none':'block';continueBtn.style.display='none';if(s.choices){s.choices.forEach(([label,target])=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=label;b.onclick=()=>typeof target==='function'?target():render(target);choicesEl.appendChild(b)})}else if(s.next!==undefined){continueBtn.style.display='block';continueBtn.onclick=()=>render(s.next)}}
startButton.onclick=()=>{start.classList.add('hidden');render(0)};
</script></body></html>
