<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Incontro clandestino — Demo</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#game{position:relative;width:100%;height:100dvh;max-width:900px;margin:auto;overflow:hidden;background:#111}#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 35%,rgba(0,0,0,.75) 100%);pointer-events:none}#box{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));background:rgba(8,9,14,.9);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 13px;z-index:2;max-height:46%;overflow:auto;backdrop-filter:blur(5px)}#name{font-weight:800;color:#ffd6df;margin-bottom:6px;font-size:15px}#text{font-size:15px;line-height:1.5;white-space:pre-line}#choices{display:grid;gap:8px;margin-top:11px}.choice{width:100%;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:650;background:#f1f2f4;color:#1678c8;min-height:42px}.choice:active{transform:scale(.98)}#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:rgba(0,0,0,.18)}#start button{border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;background:#f2f2f4;color:#147bd1}.end{font-weight:800;color:#ffd6df}</style></head><body><div id="game"><img id="scene" src="Intro%20.PNG" alt=""><div id="shade"></div><div id="box"><div id="name"></div><div id="text"></div><div id="choices"></div></div><div id="start"><button id="startButton">Inizia la demo</button></div></div><script>
const imgs={intro:'Intro%20.PNG',round1:'Ring.PNG',r2:'Inizio%202%20round.PNG',watch:'La%20ragazza%20vede%20il%20nostro%20stato.PNG',tease:'La%20ragazza%20vede%20il%20nostro%20stato.PNG',hit:'Colpo%20stordente%20.PNG',hitTease:'Colpo%20stordente%20(provocatoria).PNG',stagger:'Svenimento.PNG',ko:'Ko.PNG',koTease:'Ko%20(provocazione%20.PNG'};
const scene=document.getElementById('scene'),nameEl=document.getElementById('name'),textEl=document.getElementById('text'),choicesEl=document.getElementById('choices'),start=document.getElementById('start');
let her=0,damage=0,phase=0;
function show(img,name,text,options=[]){scene.src=imgs[img];nameEl.textContent=name;textEl.textContent=text;choicesEl.innerHTML='';options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o[0];b.onclick=o[1];choicesEl.appendChild(b)})}
function choice(label,fn,kind){return [label,()=>{if(kind==='her')her++;if(kind==='us')her--;fn()}]}
function begin(){start.style.display='none';show('intro','Lei','Il gong non è ancora suonato. Lei tiene i guantoni davanti al viso, cercando di sembrare più sicura di quanto sia davvero.\n\nÈ una principiante. Si vede dal modo in cui guarda le corde, dalla rigidità dei piedi, da quella piccola esitazione prima di ogni movimento.\n\nIo invece dovrei essere quello a controllare l’incontro. E proprio per questo il pensiero che mi attraversa la mente mi sembra quasi scontato: *non dovrebbe essere difficile*.',[choice('La osservo senza darle indicazioni.',r1a,'her'),choice('Le lascio tutto il tempo per prepararsi.',r1b,'her'),choice('Cerco subito di imporre il ritmo.',r1c,'us')])}
function r1a(){show('round1','Io','Lei nota che la sto studiando e abbassa appena lo sguardo.\n\nPer un attimo sembra ancora più timida. Poi inspira profondamente e torna a guardarmi.\n\n«Va bene…» mormora. «Cominciamo.»\n\nIl gong suona. Mi aspettavo di sentirmi completamente padrone della situazione. Invece lei non scappa. Rimane davanti a me e prova a seguire i miei passi.',[['Continua.',round2]])}
function r1b(){show('round1','Lei','«Grazie…» dice piano.\n\nQuel semplice gesto sembra toglierle un po’ di tensione. Quando il gong suona, avanza lentamente. Non è elegante, non è precisa, ma non sembra più paralizzata.\n\n*Le ho dato tempo. Forse troppo.*\n\nLa cosa mi passa per la testa mentre lei comincia a capire la distanza.',[['Continua.',round2]])}
function r1c(){show('round1','Io','Avanzo subito. Voglio farle capire la differenza di esperienza.\n\nLei arretra di mezzo passo, sorpresa. Poi alza la guardia.\n\n«Ah…»\n\nNon sembra spaventata quanto mi aspettavo. La sua esitazione dura poco.',[['Continua.',round2]])}
function round2(){phase=1;show('r2','Io','Il secondo round comincia.\n\nHo il fiato più corto. Cerco di non mostrarlo. Lei se ne accorge quasi subito. Non dice niente: mi guarda, studia i miei piedi e aspetta.\n\n*È una principiante. Non può davvero aver capito il mio ritmo così in fretta.*\n\nPoi fa un passo avanti. Io reagisco d’istinto.',[choice('Prendo il centro e la costringo ad arretrare.',r2a,'her'),choice('Aspetto che sia lei a venire avanti.',r2b,'her'),choice('Cambio ritmo e provo a sorprenderla.',r2c,'us')])}
function r2a(){damage++;show('watch','Lei','Lei arretra, ma invece di abbassare la guardia mi osserva meglio.\n\n«Sei stanco?»\n\nLa domanda è semplice. Quasi gentile.\n\nNon rispondo.\n\n*Non può averlo capito così facilmente.*\n\nLei stringe appena i guantoni. Non sembra più soltanto intimorita: è curiosa.',[['«Concentrati.»',middle],['Non rispondo.',middle],['«Non pensare di aver capito tutto.»',middle]])}
function r2b(){show('watch','Lei','Lei entra appena nella distanza e poi si ferma.\n\n«Prima eri molto più sicuro.»\n\nMi si stringe lo stomaco.\n\n*Se n’è accorta.*\n\nÈ la frase più innocua che potrebbe dire, eppure mi pesa più di un colpo.',[['«Ti stai illudendo.»',middle],['Sollevo la guardia.',middle],['«Continua a provare.»',middle]])}
function r2c(){damage++;show('watch','Io','Provo a cambiare ritmo. Per un istante penso di averla sorpresa. Poi lei arretra nel momento giusto.\n\nMi guarda.\n\n«Stavi cercando di farmi sbagliare?»\n\nAnnuisco appena.\n\nIl problema è che adesso sa che sto iniziando a preoccuparmi.',[['Riparto subito.',middle],['Mi fermo e osservo.',middle],['«Vieni avanti.»',middle]])}
function middle(){show('tease','Lei','Per qualche secondo nessuno parla.\n\nLei mi osserva come se stesse mettendo insieme dei pezzi. Poi sorride appena, quasi incredula.\n\n«Sai cosa mi fa strano?»\n\nFa un piccolo passo.\n\n«All’inizio pensavo che avrei dovuto soltanto cercare di non farmi colpire.»\n\nUna pausa.\n\n«Adesso invece sto iniziando a capire quando ti muovi.»\n\nQuelle parole mi fanno più male di quanto dovrebbero.\n\n*Una ragazza senza esperienza mi sta dicendo che mi ha studiato.*\n\nCerco di non pensarci. Ma il pensiero resta.',[choice('Le lascio l’iniziativa.',hitA,'her'),choice('Aspetto il suo errore.',hitB,'her'),choice('Entro prima che possa muoversi.',hitC,'us')])}
function hitA(){damage++;show('hit','Lei','Lei parte. Il colpo arriva più pulito di quanto mi aspettassi.\n\nLo sento sulla guardia e arretrato di un passo.\n\nLei stessa sembra sorpresa.\n\n«Ti ho… fatto arretrare?»\n\nNon rispondo subito.\n\n*Non devo lasciarle capire quanto mi abbia colpito.*',[['Torno avanti.',afterHit],['Mi chiudo.',afterHit],['Cerco di non mostrare nulla.',afterHit]])}
function hitB(){damage++;show('hit','Io','Aspetto il suo errore. Lei entra, esita, poi cambia direzione.\n\nLa mia risposta arriva in ritardo. Il suo guantone mi raggiunge prima che possa completare il movimento.\n\nIl dolore è sopportabile. L’umiliazione molto meno.\n\n*Ho aspettato troppo davanti a una principiante.*',[['Attacco subito.',afterHit],['Arretro.',afterHit],['Resto in guardia.',afterHit]])}
function hitC(){show('hitTease','Lei','Entro prima che possa muoversi. Lei reagisce d’istinto.\n\nIl colpo mi raggiunge.\n\nPer un attimo rimango fermo. Lei torna in guardia e mi guarda con gli occhi spalancati.\n\n«Scusa…»\n\nPoi si accorge che non sto dicendo nulla.\n\n«Cioè… non volevo sorprenderti così.»',[['«Non scusarti.»',afterHit],['Faccio un passo indietro.',afterHit],['Torno avanti.',afterHit]])}
function afterHit(){damage++;show('tease','Io','Il combattimento continua.\n\nMi accorgo che sto pensando troppo a come tutto questo deve apparire. Un professionista che fatica contro una ragazza che, quando è salita sul ring, non sapeva nemmeno cosa aspettarsi.\n\nLei non sembra ancora consapevole di quanto la situazione sia cambiata. Ma ogni volta che mi costringe a reagire, acquisisce un po’ più di sicurezza.\n\n*La cosa peggiore sarebbe lasciarle capire che sono in difficoltà.*',[choice('La provoco e la faccio avanzare.',lateA,'her'),choice('Resto prudente e le lascio il dubbio.',lateB,'her'),choice('Provo a chiudere subito lo scambio.',lateC,'us')])}
function lateA(){damage++;show('hitTease','Lei','La provocazione funziona al contrario. Lei avanza e il suo pugno mi costringe a chiudermi.\n\n«Pensavi davvero che sarei scappata?»\n\nLa sua voce è ancora un po’ tremante, ma dietro c’è una sicurezza che prima non c’era.',[['Continuo.',endFight],['Cambio angolo.',endFight],['Resto fermo.',endFight]])}
function lateB(){show('watch','Lei','Lei non attacca subito. Mi guarda.\n\n«Stai cercando di farmi sbagliare.»\n\nNon è una domanda.\n\nFaccio un passo laterale. Lei lo segue.\n\n*Sta imparando durante il combattimento. Ed è proprio questo che mi mette a disagio.*', [['Avanzo.',endFight],['Aspetto.',endFight],['Cambio ritmo.',endFight]])}
function lateC(){damage++;show('hit','Io','Provo a chiudere lo scambio. Per un istante sembra funzionare. Poi lei si sposta e mi colpisce di nuovo.\n\nLe gambe mi sembrano più pesanti.\n\nLei mi guarda. Non sorride.\n\n«Sei stanco davvero, vero?»\n\nNon riesco a risponderle.',[['Continuo ad attaccare.',endFight],['Mi copro.',endFight],['Cerco spazio.',endFight]])}
function endFight(){damage++;show('stagger','Io','Il respiro mi pesa nel petto. Cerco di rimettere insieme la guardia.\n\nLei fa un passo avanti e si ferma. Per qualche secondo non attacca.\n\n«Ehi… tutto bene?»\n\nLa domanda è sincera.\n\nEd è proprio questo a farmi male. Non voglio la sua compassione. Non voglio che una ragazza che fino a poco fa aveva paura di me mi guardi come se fossi quello che ha bisogno di essere rassicurato.\n\n*Non posso finire così.*\n\nIl gong sembra lontanissimo.',[choice('Gioco tutto sull’attacco.',win,'us'),choice('Aspetto il contrattacco.',lose,'her'),choice('Provo soltanto a resistere.',lose,'her')])}
function win(){show('round1','Io','Trovo finalmente l’apertura.\n\nEntro nel momento giusto. Lei è costretta ad arretrare e per la prima volta dall’inizio del secondo round sono io a riprendere il controllo.\n\nLa campanella suona.\n\nLei mi guarda sorpresa. Poi abbassa lentamente i guantoni.\n\n«Quindi… non avevi ancora finito.»\n\nAbbasso la guardia.\n\nLa demo si chiude qui perché non abbiamo ancora l’immagine della nostra vittoria.\n\n<span class="end">FINE DEMO — VITTORIA</span>',[['Ricomincia',()=>location.reload()]])}
function lose(){show('hitTease','Lei','Aspetto troppo. Lei entra nella distanza che ormai conosce.\n\nIl suo pugno parte.\n\nLo vedo arrivare, ma il mio corpo reagisce con un istante di ritardo.\n\nIl colpo mi spegne il pensiero per un attimo. Faccio un passo indietro. Poi un altro.\n\n*No…*\n\nLa mia coscienza comincia a sfumare ai bordi.\n\nLei rimane davanti a me. La vedo appena.',[['Cerco di restare in piedi.',ko],['Muovo le gambe.',ko],['Mi aggrappo alla guardia.',ko]])}
function ko(){if(her>=3)return provocativeFinal();return timidFinal()}
function timidFinal(){show('ko','Lei','Il mio equilibrio sparisce del tutto. Cado.\n\nLei rimane immobile, incredula. Gli occhi si allargano e i guantoni restano sollevati, incerti.\n\n«L’ho… davvero mandato KO?»\n\nLa sua voce trema. Non c’è fierezza. Solo stupore.\n\nFa mezzo passo verso di me e poi si ferma.\n\n«Ehi… mi senti?»\n\nNessuna risposta.\n\nLa ragazza abbassa lentamente lo sguardo. Sembra quasi tornata alla ragazza timida dell’inizio.',[['Continua.',timid2]])}
function timid2(){show('ko','Lei','«Mi dispiace…» mormora. «Non volevo che finisse così.»\n\nPoi si corregge subito.\n\n«Cioè… volevo vincere. Ma non pensavo davvero di riuscirci.»\n\nGuarda i propri guantoni.\n\n«Eri molto più forte di me.»\n\nUna pausa.\n\n«Non capisco ancora come sia successo.»\n\nIl suo tono è sincero. Nessuna presa in giro. Nessuna sicurezza ostentata. Solo una ragazza che non riesce a credere al risultato.',[['Continua.',timid3]])}
function timid3(){show('ko','Lei','Il silenzio pesa.\n\nLei torna a guardarmi.\n\n«Prima dell’incontro avevo paura di te.»\n\nAbbassa gli occhi.\n\n«Adesso credo di avere ancora più rispetto per te.»\n\nEsita.\n\n«Quando ti rialzerai… vorrei che sapessi che non penso di essere diventata improvvisamente forte.»\n\nUn piccolo sorriso imbarazzato.\n\n«Credo solo di essere riuscita a resistere abbastanza a lungo.»\n\n*Ho perso contro una ragazza che, fino a poco fa, non credeva nemmeno di poter vincere.*',[['Continua.',timidEnd]])}
function timidEnd(){show('ko','Lei','Lei rimane ancora qualche secondo accanto a me.\n\n«Credo che questa sia la cosa più incredibile che mi sia mai successa.»\n\nSorride appena, quasi imbarazzata dalla propria stessa vittoria.\n\n«Ma non voglio prenderti in giro.»\n\nLa sua espressione torna timida. Quasi la stessa ragazza dell’inizio. Solo che adesso sa di aver vinto.\n\n<span class="end">FINE DEMO — FINALE TIMIDO</span>',[['Ricomincia',()=>location.reload()]])}
function provocativeFinal(){show('koTease','Lei','Il mio equilibrio sparisce del tutto. Cado.\n\nPer un istante lei resta ferma. Poi la sorpresa lascia lentamente spazio a un sorriso.\n\n«Oh… questa non me l’aspettavo.»\n\nAbbassa i guantoni e mi guarda. Non sembra più la ragazza nervosa dell’inizio.\n\n«Forse mi hai sottovalutata un po’ troppo.»\n\nLa frase è calma. Ed è proprio quella calma a rendere tutto più difficile.',[['Continua.',prov2]])}
function prov2(){show('koTease','Lei','Lei mi osserva mentre non riesco a rialzarmi.\n\n«E pensare che all’inizio sembravi così sicuro…»\n\nIl sorriso si allarga appena.\n\n«Adesso invece non riesci nemmeno a guardarmi.»\n\nIl pensiero che avevo cercato di nascondere torna con forza.\n\n*Una principiante mi ha studiato. Mi ha fatto arretrare. E adesso è lei quella rimasta in piedi.*\n\nLei sembra accorgersi del mio disagio. Potrebbe fermarsi.\n\nInvece inclina appena la testa.\n\n«Devo ammetterlo… è stato quasi divertente.»',[['Continua.',prov3]])}
function prov3(){show('koTease','Lei','«Sai qual è la cosa strana?»\n\nSorride.\n\n«Quando è iniziato l’incontro avevo paura di te.»\n\nUna pausa.\n\n«Adesso invece sono io che mi chiedo quanto ci hai messo a capire che eri nei guai.»\n\nNon riesco a risponderle.\n\nLei lascia uscire una breve risata.\n\n«Tranquillo. Non lo racconterò a nessuno.»\n\nPausa.\n\n«Forse.»', [['Continua.',provEnd]])}
function provEnd(){show('koTease','Lei','Quando finalmente sorride, non c’è più traccia della ragazza intimidita che avevo visto prima del gong.\n\n«Credo di aver capito una cosa stasera.»\n\nAlza lentamente i guantoni.\n\n«Non basta essere esperti per vincere.»\n\nMi guarda un’ultima volta.\n\n«E non dovresti mai decidere quanto vale un avversario prima di averlo affrontato.»\n\nIl sorriso torna leggermente provocatorio.\n\n«Soprattutto se quell’avversario sono io.»\n\nLa cosa più difficile da accettare non è soltanto il KO. È sapere che una ragazza inesperta ha acquisito abbastanza sicurezza da capire esattamente quanto mi stesse mettendo in difficoltà.\n\n<span class="end">FINE DEMO — FINALE PROVOCATORIO</span>',[['Ricomincia',()=>location.reload()]])}
startButton.onclick=begin;
begin();
</script></body></html>
