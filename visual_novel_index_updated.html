<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Visual Novel</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#g{position:relative;width:100%;height:100dvh;max-width:900px;margin:auto;overflow:hidden;background:#111}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:linear-gradient(transparent 34%,rgba(0,0,0,.78));pointer-events:none}#ui{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));background:rgba(7,8,12,.92);border-radius:14px;padding:13px;z-index:2;max-height:48%;overflow:auto}#who{font-weight:800;color:#ffd5df;margin-bottom:6px}#tx{white-space:pre-line;line-height:1.52;font-size:15px}.ch{display:grid;gap:8px;margin-top:12px}.ch button{border:0;border-radius:10px;padding:11px;background:#f1f2f4;color:#1678c8;font-weight:700;font-size:14px;min-height:42px}#start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.12);z-index:5}#start button{border:0;border-radius:12px;padding:14px 22px;background:#f1f2f4;color:#1678c8;font-size:17px;font-weight:700}</style></head><body><div id="g"><img id="bg"><div id="shade"></div><div id="ui"><div id="who"></div><div id="tx"></div><div id="choices" class="ch"></div></div><div id="start"><button onclick="begin()">Inizia la demo</button></div></div><script>
const raw={
intro:'Intro .PNG',gloves:'Gloves.PNG',idle:'Idle.PNG',ring:'Ring.PNG',a1:'Attacco 1.PNG',a2:'Attacco 2.PNG',a3:'Attacco 3.PNG',down:'A terra .PNG',r2:'Inizio 2 round.PNG',pause:'Pausa.PNG',watch:'La ragazza vede il nostro stato.PNG',watchP:'La ragazza vede il nostro stato (provocatoria).PNG',hit:'Colpo stordente .PNG',hitP:'Colpo stordente (provocatoria).PNG',upper:'Montante.PNG',stun:'Svenimento.PNG',ko:'Ko.PNG',koP:'Ko (provocazione).PNG',fallT:'Caduta tra le gambe della ragazza.PNG',fallP:'Caduta tra le gambe della ragazza (provocazione).PNG',koT:'Ko.PNG',koTP:'Ko (provocazione).PNG',count:'La ragazza attende il conteggio (timida).PNG',countP:'La ragazza attende il conteggio (provocatoria).PNG',winT:'Posa della vittoria (timida).PNG',winP:'Posa della vittoria (provocatoria).PNG',near:'La ragazza che si avvicina a noi (finale timido).PNG',look:'La ragazza ci guarda dall’alto in basso (finale provocatorio).PNG',footT:'Piede poggiato (finale timido).PNG',footP:'Piede poggiato (finale provocatorio).PNG',sitT:'La ragazza che ci guarda in che stato siamo (finale timido).PNG',sitP:'Provocazione umiliante (finale provocatorio).PNG',selfT:'Selfie vittoria (timido).PNG',selfP:'Selfie vittoria (provocatorio).PNG',photoT:'Posa della foto (finale timido).PNG',photoT2:'Posa della foto2 (finale timido .PNG',photoP:'Posa della foto (finale provocatorio).PNG',exit:'Uscita dal ring.PNG',stats:'Risultati.PNG',phone:'Epilogo ragazza.PNG'};
const A={};Object.keys(raw).forEach(k=>A[k]=encodeURI(raw[k]));const bg=document.querySelector('#bg'),who=document.querySelector('#who'),tx=document.querySelector('#tx'),cs=document.querySelector('#choices'),start=document.querySelector('#start');let score=0,prov=0;
function S(im,n,t,opts=[]){bg.src=A[im]||A.idle;who.textContent=n;tx.textContent=t;cs.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o[0];b.onclick=o[1];cs.appendChild(b)})}function C(label,fn,dp=0,ds=0){return[label,()=>{prov+=dp;score+=ds;fn()}]}
function begin(){start.style.display='none';S('intro','Mika',`Mika ha diciotto anni. È una ragazza normale, timida e senza esperienza nella boxe. Non ha mai pensato di poter salire su un ring contro un professionista.

Ha accettato questo incontro per il premio in denaro. Aveva bisogno di quei soldi e pensava che sarebbe stato un incontro alla sua portata. Solo quando arriva scopre chi sarà il suo avversario.

Io.

Un pugile professionista.

Mika stringe i guantoni. È nervosa, ma non scappa. Fa un respiro profondo e cerca di convincersi che può farcela.`,[[`La osservo senza dire nulla.`,r1],[`Le concedo qualche secondo per prepararsi.`,r1],[`Cerco subito di metterle pressione.`,r1]])}
function r1(){S('ring','Luca',`Il gong dà inizio al combattimento.

Mika parte con cautela. La sua guardia è ancora incerta e i suoi movimenti sono quelli di chi sta imparando mentre combatte. Io controllo il centro del ring e per buona parte del primo round faccio esattamente quello che dovrebbe fare un professionista.

Eppure noto qualcosa: dopo ogni scambio Mika mi osserva. Non sembra cercare soltanto di sopravvivere. Sta imparando.`,[[`Il round continua.`,r1b]])}function r1b(){S('idle','Luca',`Il ritmo rallenta. Mika respira profondamente e rimane in guardia.

«Non sei come mi aspettavo…» dice piano.

Non capisco se sia un complimento o se stia semplicemente cercando di parlare per calmarsi.

*Per ora non importa. Sono io il professionista.*`,[[`Aspetto il gong.`,pause1]])}function pause1(){S('pause','Mika',`Durante la pausa Mika beve e cerca di recuperare il fiato.

Non parla molto. Quando torna a guardarmi, però, il suo sguardo è diverso: meno spaventato.`,[[`Il secondo round comincia.`,r2]])}
function r2(){S('r2','Luca',`Il secondo round comincia.

Il mio respiro è più pesante. Mika lo nota quasi subito.

*È una principiante. Non può essere lei a dettare il ritmo.*

Faccio un passo avanti. Lei non arretra.`,[C(`Prendo il centro e la costringo ad arretrare.`,p1,1,1),C(`Aspetto che sia lei a venire avanti.`,p2,1,0),C(`Cambio ritmo e provo a sorprenderla.`,p3,0,2)])}
function p1(){S('watch','Mika',`Mika arretra di mezzo passo. Poi mi guarda.

«Sei stanco?»

La domanda è timida, quasi si vergognasse di averla fatta.

*Se se n'è accorta, è un problema.*

Lei rialza la guardia.`,[[`«Concentrati su di te.»`,m1],[`Non rispondo.`,m1],[`«Non pensare di aver capito tutto.»`,m1]])}function p2(){S('watch','Mika',`Mika entra nella distanza e si ferma.

«Prima sembravi molto più sicuro.»

Non c'è arroganza nella sua voce. È soltanto un'osservazione.

*Ed è proprio questo che mi irrita.*`,[[`«Ti stai illudendo.»`,m1],[`Resto in guardia.`,m1],[`«Continua a provare.»`,m1]])}function p3(){S('idle','Luca',`Cambio ritmo. Per un attimo penso di averla sorpresa. Mika però legge il movimento e si sposta.

«Stavi cercando di farmi sbagliare?»

*Non dovrebbe essere lei a farmi domande del genere.*`,[[`Riparto subito.`,m1],[`Osservo la sua guardia.`,m1],[`«Vieni avanti.»`,m1]])}
function m1(){S('idle','Mika',`Per alcuni secondi rimaniamo fermi.

Mika inspira.

«All'inizio pensavo solo a non farmi male.»

Fa un passo.

«Adesso penso che posso davvero combattere.»

*Una ragazza senza esperienza mi sta dicendo che crede di poter vincere.*

Il pensiero mi pesa più di un colpo.`,[C(`Le lascio l'iniziativa.`,h1,1,-1),C(`Aspetto il suo errore.`,h2,1,-1),C(`Entro prima che possa partire.`,h3,0,2)])}
function h1(){S('a1','Mika',`Mika parte. Il primo attacco arriva sulla mia guardia e mi costringe ad arretrare.

«Ti ho fatto arretrare?»

Il suo tono è quasi incredulo.

*Non devo lasciarle capire quanto mi abbia sorpreso.*`,[[`Torno avanti.`,hnext],[`Mi chiudo.`,hnext],[`Faccio finta di nulla.`,hnext]])}function h2(){S('a2','Mika',`Aspetto troppo. Mika entra e il suo colpo mi raggiunge prima della mia risposta.

Il dolore è sopportabile.

L'umiliazione molto meno.

*Ho aspettato un errore che non è arrivato.*`,[[`Attacco subito.`,hnext],[`Arretro.`,hnext],[`Resto in guardia.`,hnext]])}function h3(){S('a3','Mika',`Entro prima che possa muoversi. Mika reagisce d'istinto e il suo colpo mi raggiunge.

Lei torna subito in guardia.

«Scusa…»

*Non voglio le sue scuse.*`,[[`«Non scusarti.»`,hnext],[`Faccio spazio.`,hnext],[`Torno avanti.`,hnext]])}function hnext(){S(prov>=2?'watchP':'watch','Luca',`Il combattimento continua.

Più passa il tempo, più diventa difficile ignorare la realtà: sto facendo fatica contro una ragazza che, prima di stasera, non aveva esperienza.

*Se perdo, non sarà una semplice sconfitta. Sono un professionista. Lei è salita qui senza sapere nemmeno cosa aspettarsi.*

Mika mi guarda. La sua timidezza è ancora lì, ma adesso è accompagnata dalla sicurezza di chi ha capito di poter reggere il confronto.`,[C(`La provoco per farle perdere la calma.`,branchP,2,-1),C(`Resto prudente e cerco di non cedere.`,branchT,1,0),C(`Forzo uno scambio rischioso.`,branchA,0,2)])}
function branchP(){S('watchP','Mika',`La provoco.

Mika stringe i guantoni.

«Pensavi che sarei scappata?»

La voce è più ferma. La timidezza non è scomparsa, ma sotto di essa compare un atteggiamento più sicuro.

*Ho spinto troppo. E adesso lei vuole dimostrarmi qualcosa.*`,[[`Continuo a provocarla.`,fightP],[`Smetto di parlare.`,fightP],[`Cerco di chiudere lo scambio.`,fightP]])}function branchT(){S('watch','Mika',`Resto prudente.

Mika non sorride. Mi studia e continua a muoversi con attenzione.

«Non voglio farti male…» dice piano.

*È quasi peggio. Non voglio la sua gentilezza. Voglio soltanto tornare a essere quello che controlla l'incontro.*`,[[`Avanzo.`,fightT],[`Aspetto.`,fightT],[`Cambio angolo.`,fightT]])}function branchA(){S('hit','Mika',`Forzo uno scambio. Mika assorbe il colpo, ma riesce a rispondere.

Il fiato mi manca per un istante.

«Non sei invincibile…» mormora.

*Questa volta l'ho sentita.*`,[[`Continuo.`,fightT],[`Mi copro.`,fightT],[`Arretro.`,fightT]])}
function fightT(){S('upper','Luca',`Mika avanza. Io provo a rispondere, ma il suo montante arriva prima.

La testa si sposta all'indietro.

*Non può finire così.*

Cerco di rimettere insieme la guardia.`,[[`Resisto e continuo.`,finish],[`Aspetto il suo prossimo attacco.`,finish],[`Provo a recuperare il fiato.`,finish]])}function fightP(){S('hitP','Mika',`Mika avanza senza più esitare.

«Adesso tocca a me.»

Il suo colpo mi raggiunge e mi fa perdere equilibrio.

*La ragazza che all'inizio non riusciva nemmeno a guardarmi negli occhi sta combattendo come se fosse lei quella sicura di vincere.*`,[[`Cerco di restare in piedi.`,finishP],[`La provoco ancora.`,finishP],[`Mi copro.`,finishP]])}
function finish(){S('stun','Luca',`Le gambe diventano pesanti. Il rumore intorno a me sembra lontanissimo.

Mika si avvicina e si ferma.

«Ehi… tutto bene?»

La domanda è sincera.

*Non voglio la sua compassione. Non dopo tutto quello che ho costruito come professionista.*

Cerco di sollevare la guardia.`,[C(`Gioco tutto sull'attacco.`,ourWin,0,4),C(`Aspetto il contrattacco.`,loseTim,1,0),C(`Provo soltanto a resistere.`,loseTim,1,-1)])}function finishP(){S('down','Luca',`Il mio equilibrio peggiora.

Mika vede in che stato sono ridotto. Per un attimo sembra sorpresa persino lei.

Poi torna in guardia.

*Una principiante. Sto davvero perdendo contro una principiante.*`,[C(`Cerco un ultimo attacco.`,ourWin,0,4),C(`Aspetto che si avvicini.`,loseProv,2,0),C(`Mi copro e provo a resistere.`,loseProv,1,-1)])}
function ourWin(){S('idle','Luca',`Trovo finalmente un'apertura e riesco a chiudere lo scambio.

Mika arretra. Il gong suona.

Sono ancora in piedi.

La demo si conclude qui per il nostro finale, perché non abbiamo un'immagine dedicata alla nostra vittoria.`,[[`Continua.`,statsWin]])}
function loseTim(){S('hit','Mika',`Mika approfitta dell'esitazione.

Il colpo arriva pulito. La mia coscienza comincia a svanire.

*No… non davanti a lei.*`,[[`Continua.`,fallTim]])}function loseProv(){S('hitP','Mika',`Mika approfitta della mia esitazione.

Il colpo arriva e la coscienza comincia a svanire.

«Non mollare adesso…» dice con un sorriso sicuro.`,[[`Continua.`,fallProv]])}
function fallTim(){S('stun','Luca',`Barcollo. Cerco di trovare il ring con i piedi, ma non ci riesco.

Il corpo non risponde più.

Mika fa un passo verso di me.`,[[`Continuo.`,()=>S('fallT','Mika',`Cado a terra, privo di sensi. Mika rimane immobile per un istante, sorpresa da quanto rapidamente sia finito tutto.`,[[`Continua.`,koTim]])]])}function fallProv(){S('stun','Luca',`Barcollo. La vista si appanna.

Mika si avvicina.

Il ring sparisce dalla mia percezione.`,[[`Continuo.`,()=>S('fallP','Mika',`Cado a terra tra le sue gambe, completamente privo di sensi.

Mika mi guarda e questa volta non sembra più intimidita.`,[[`Continua.`,koProv]])]])}function koTim(){S('ko','Mika',`Rimango a terra. Mika mi guarda, ancora stupita.

Il conteggio comincia.

Lei non festeggia. Sembra quasi dispiaciuta che sia finita in questo modo.`,[[`Continua.`,countTim]])}function koProv(){S('koP','Mika',`Rimango a terra. Mika mi guarda dall'alto.

Il conteggio comincia.

Questa volta sul suo volto c'è soddisfazione.`,[[`Continua.`,countProv]])}function countTim(){S('count','Mika',`Mika aspetta il conteggio.

«L'ho davvero battuto…?»

Quando arriva l'ultimo numero, abbassa lentamente i guantoni.`,[[`Continua.`,victTim]])}function countProv(){S('countP','Mika',`Mika aspetta il conteggio senza distogliere lo sguardo.

Quando arriva l'ultimo numero sorride.

«Quindi era davvero possibile.»`,[[`Continua.`,victProv]])}
function victTim(){S('winT','Mika',`La vittoria la rende quasi imbarazzata.

«Non pensavo di farcela.»

Non c'è superiorità. Solo la sorpresa di aver sconfitto un professionista.`,[[`Continua.`,nearTim]])}function victProv(){S('winP','Mika',`Mika posa con sicurezza.

«Alla fine sei stato tu a cadere.»

La frase è tranquilla, ma non nasconde la soddisfazione.`,[[`Continua.`,nearProv]])}
function nearTim(){S('near','Mika',`Mika si avvicina.

«Mi dispiace… davvero. Però grazie. Non pensavo di essere capace di una cosa simile.»`,[[`Continua.`,footTim]])}function nearProv(){S('look','Mika',`Mika ci guarda dall'alto in basso.

«La prossima volta non sottovalutare qualcuno solo perché è alla prima esperienza.»`,[[`Continua.`,footProv]])}function footTim(){S('footT','Mika',`Mika rimane accanto a noi. È ancora incredula per quello che è successo.`,[[`Continua.`,sitTim]])}function footProv(){S('footP','Mika',`Mika mantiene il suo atteggiamento sicuro.

«È incredibile. Un professionista… e sei finito qui.»`,[[`Continua.`,sitProv]])}function sitTim(){S('sitT','Mika',`Mika si siede e ci guarda.

«Sei davvero un professionista… eppure ho vinto io.»`,[[`Continua.`,selfTim]])}function sitProv(){S('sitP','Mika',`Mika si siede e continua a guardarci.

«Stasera quello che non riusciva più a stare in piedi eri tu.»`,[[`Continua.`,selfProv]])}function selfTim(){S('selfT','Mika',`Mika scatta un selfie.

Sorride timidamente.

«Ancora non ci credo…»`,[[`Continua.`,photoTim]])}function selfProv(){S('selfP','Mika',`Mika scatta un selfie.

Sorride senza nascondere la soddisfazione.

«Questa me la voglio ricordare.»`,[[`Continua.`,photoProv]])}function photoTim(){S('photoT','Mika',`Mika guarda la foto della vittoria e poi ne scatta un'altra.`,[[`Continua.`,photoTim2]])}function photoTim2(){S('photoT2','Mika',`Mika osserva la seconda foto.

«Forse questa la tengo.»`,[[`Continua.`,exitEnd]])}function photoProv(){S('photoP','Mika',`Mika guarda la foto della vittoria e sorride.

«Sì. Questa va bene.»`,[[`Continua.`,exitEnd]])}function exitEnd(){S('exit','Mika',`Mika esce dal ring.

La serata continua a sembrarle irreale. È entrata pensando di non avere possibilità e ne è uscita con una vittoria contro un professionista.`,[[`Continua.`,statsLose]])}function statsWin(){S('stats','Statistiche',`RISULTATI DELL'INCONTRO

Vittoria di Luca.

La demo termina qui perché non esiste ancora un'immagine dedicata alla nostra celebrazione della vittoria.`,[[`Fine demo.`,()=>{}]])}function statsLose(){S('stats','Statistiche',`RISULTATI DELL'INCONTRO

Vittoria di Mika.

Il risultato viene mostrato prima dell'epilogo.`,[[`Continua.`,phone]])}function phone(){S('phone','Mika',`Più tardi, a casa, Mika è al telefono con la sua amica.

«Non ci crederai mai. Ho davvero vinto.»

Ascolta la risposta e ride piano.

«All'inizio avevo una paura tremenda. Poi però ho capito che potevo farcela.»

La telefonata continua ancora per qualche minuto. Mika ripensa al combattimento, al momento in cui ha smesso di sentirsi una principiante e ha capito di poter reggere il confronto.`,[[`Continua.`,hospital]])}function hospital(){bg.src='';who.textContent='';tx.textContent=`Quando riapro gli occhi, vedo un soffitto bianco.

Per qualche secondo non ricordo dove sono. Poi tornano il ring, il gong e l'ultimo colpo.

Sono in ospedale.

La parte più difficile non è il dolore. È ricordare contro chi ho perso.

Una principiante.

Una ragazza che era salita sul ring senza esperienza e che, alla fine, era rimasta in piedi mentre io non riuscivo più a farlo.

*Non dimenticherò facilmente questa notte.*

FINE — SCONFITTA`;cs.innerHTML='';const b=document.createElement('button');b.textContent='Ricomincia';b.onclick=()=>location.reload();cs.appendChild(b)}
S('idle','','');</script></body></html>
