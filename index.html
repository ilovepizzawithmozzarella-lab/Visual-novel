<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incontro clandestino - Demo</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game{height:100%;max-width:900px;margin:auto;position:relative;overflow:hidden;background:#111}#scene{width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(0,0,0,.9))}#box{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(10,10,16,.92);border-radius:18px;padding:16px;z-index:2}#name{font-weight:700;color:#ffd4df;margin-bottom:7px}#text{line-height:1.45;min-height:64px}#choices{display:grid;gap:8px;margin-top:12px}button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:650}#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;background:rgba(0,0,0,.25)}#start button{font-size:17px;padding:15px 22px}.hide{display:none}</style></head><body><div id="game"><img id="scene"><div id="shade"></div><div id="box"><div id="name"></div><div id="text"></div><div id="choices"></div></div><div id="start"><button onclick="begin()">Inizia la demo</button></div></div><script>const imgs={intro:"data:image/jpeg;base64,REPLACE_INTRO",ring:"data:image/jpeg;base64,REPLACE_RING",gloves:"data:image/jpeg;base64,REPLACE_GLOVES"};const scene=document.querySelector('#scene'),name=document.querySelector('#name'),text=document.querySelector('#text'),choices=document.querySelector('#choices'),start=document.querySelector('#start');function show(img,n,t,cs){scene.src=imgs[img];name.textContent=n;text.textContent=t;choices.innerHTML='';cs.forEach(c=>{let b=document.createElement('button');b.textContent=c[0];b.onclick=c[1];choices.appendChild(b)})}function begin(){start.classList.add('hide');show('intro','Lei','Non avrei mai pensato di finire in un posto del genere… Mi hanno detto che avrei guadagnato abbastanza soldi. Però nessuno mi aveva detto chi avrei dovuto affrontare.',[['«Sei sicura di volerlo fare?»',a],['«È davvero un incontro clandestino?»',b]])}function a(){show('ring','Lei','Lei abbassa lo sguardo. «S-sì… ho bisogno di quei soldi. Non sono mai stata in un ring, ma proverò a non tirarmi indietro.»',[['Salire sul ring',c]])}function b(){show('ring','Lei','«Sì… almeno così mi hanno detto.» Deglutisce nervosamente mentre sale sul ring. «Pensavo fosse una cosa molto più semplice…»',[['Salire sul ring',c]])}function c(){show('gloves','Lei','Quando i due avversari si avvicinano per il saluto iniziale, lei fa toccare i guantoni. Poi sente finalmente l’annuncio: il suo avversario è un pugile maschio professionista.',[['«Aspetta… professionista?!»',d],['Restare in silenzio e prepararsi',d]])}function d(){show('gloves','Lei','Il suo viso cambia. «N-non lo sapevo…» Le mani le tremano appena. Poi guarda il premio in denaro e stringe i guantoni.',[['«Non puoi più tirarti indietro.»',e],['«Possiamo parlare con l’organizzatore.»',f]])}function e(){show('gloves','Lei','Lei prende un respiro profondo. «Hai ragione… Sono venuta qui per i soldi. Farò del mio meglio.» La campanella sta per suonare.',[['Fine demo',()=>location.reload()]])}function f(){show('gloves','Lei','Lei annuisce. «Grazie… ma credo che ormai non cambierà nulla.» Si mette in guardia. La campanella sta per suonare.',[['Fine demo',()=>location.reload()]])}</script></body></html>
