<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Incontro clandestino - Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#game{position:relative;width:100%;height:100%;max-width:900px;margin:auto;overflow:hidden;background:#111}
#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05) 45%,rgba(0,0,0,.72) 100%);pointer-events:none}
#box{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:rgba(10,10,16,.88);border-radius:14px;padding:11px 12px;z-index:2;box-shadow:0 5px 24px rgba(0,0,0,.25);max-height:43%;overflow:auto}
#box.hidden{display:none}
#name{font-weight:700;color:#ffd4df;margin-bottom:4px;font-size:15px}
#text{font-size:15px;line-height:1.35;min-height:0}
#choices{display:grid;gap:7px;margin-top:9px}
.choice{border:0;border-radius:10px;padding:10px 11px;font-size:14px;font-weight:650;background:#f2f2f4;color:#171717;min-height:42px}
.choice:active{transform:scale(.98)}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:rgba(0,0,0,.22)}
#start.hidden{display:none;pointer-events:none}
#start button{border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;background:#f2f2f4;color:#147bd1;box-shadow:0 4px 18px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="game">
<img id="scene" src="Intro%20.PNG" alt="">
<div id="shade"></div>
<div id="box" class="hidden">
<div id="name"></div>
<div id="text"></div>
<div id="choices"></div>
</div>
<div id="start"><button id="startButton" type="button">Inizia la demo</button></div>
</div>
<script>
const imgs={intro:"Intro%20.PNG",ring:"Ring.PNG",gloves:"Gloves.PNG"};
const scene=document.getElementById('scene');
const nameEl=document.getElementById('name');
const textEl=document.getElementById('text');
const choicesEl=document.getElementById('choices');
const box=document.getElementById('box');
const start=document.getElementById('start');
const startButton=document.getElementById('startButton');

function show(img,n,t,cs){
 scene.src=imgs[img];
 nameEl.textContent=n;
 textEl.textContent=t;
 choicesEl.innerHTML='';
 cs.forEach(([label,action])=>{
  const b=document.createElement('button');
  b.className='choice';
  b.type='button';
  b.textContent=label;
  b.addEventListener('click',action);
  choicesEl.appendChild(b);
 });
 box.classList.remove('hidden');
}

function begin(){
 start.classList.add('hidden');
 show('intro','Lei','Non avrei mai pensato di finire in un posto del genere… Mi hanno detto che avrei guadagnato abbastanza soldi. Però nessuno mi aveva detto chi avrei dovuto affrontare.',[
 ['«Sei sicura di volerlo fare?»',a],
 ['«È davvero un incontro clandestino?»',b]
 ]);
}
function a(){show('ring','Lei','Lei abbassa lo sguardo. «S-sì… ho bisogno di quei soldi. Non sono mai stata in un ring, ma proverò a non tirarmi indietro.»',[['Salire sul ring',c]])}
function b(){show('ring','Lei','«Sì… almeno così mi hanno detto.» Deglutisce nervosamente mentre sale sul ring. «Pensavo fosse una cosa molto più semplice…»',[['Salire sul ring',c]])}
function c(){show('gloves','Lei','Quando i due avversari si avvicinano per il saluto iniziale, lei fa toccare i guantoni. Poi sente finalmente l’annuncio: il suo avversario è un pugile maschio professionista.',[['«Aspetta… professionista?!»',d],['Restare in silenzio e prepararsi',d]])}
function d(){show('gloves','Lei','Il suo viso cambia. «N-non lo sapevo…» Le mani le tremano appena. Poi guarda il premio in denaro e stringe i guantoni.',[['«Non puoi più tirarti indietro.»',e],['«Possiamo parlare con l’organizzatore.»',f]])}
function e(){show('gloves','Lei','Lei prende un respiro profondo. «Hai ragione… Sono venuta qui per i soldi. Farò del mio meglio.» La campanella sta per suonare.',[['Fine demo',()=>location.reload()]])}
function f(){show('gloves','Lei','Lei annuisce. «Grazie… ma credo che ormai non cambierà nulla.» Si mette in guardia. La campanella sta per suonare.',[['Fine demo',()=>location.reload()]])}
startButton.addEventListener('click',begin);
</script>
</body>
</html>
