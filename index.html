<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Incontro clandestino - Demo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
#game{position:relative;width:100%;height:100dvh;max-width:900px;margin:auto;overflow:hidden;background:#111}
#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 45%,rgba(0,0,0,.62) 100%);pointer-events:none}
#box{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));background:rgba(8,9,14,.88);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 13px;z-index:2;box-shadow:0 5px 24px rgba(0,0,0,.28);max-height:34%;overflow:auto;backdrop-filter:blur(5px)}
#box.hidden{display:none}
#name{font-weight:750;color:#ffd6df;margin-bottom:5px;font-size:15px}
#text{font-size:15px;line-height:1.42}
#choices{display:grid;gap:7px;margin-top:9px}
.choice{width:100%;border:0;border-radius:10px;padding:10px 11px;font-size:14px;font-weight:650;background:#f1f2f4;color:#1678c8;min-height:42px}
.choice:active{transform:scale(.98);background:#ddd}
#continue{display:block;margin:8px 0 0 auto;border:0;background:transparent;color:#aaa;font-size:12px;padding:2px 0}
#round{position:absolute;top:12px;left:12px;z-index:3;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.48);font-size:11px;font-weight:700;display:none}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:rgba(0,0,0,.12)}
#start.hidden{display:none;pointer-events:none}
#start button{border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;background:#f2f2f4;color:#147bd1;box-shadow:0 4px 18px rgba(0,0,0,.2)}
@media(max-height:650px){#box{max-height:38%;padding:9px 11px}#text{font-size:14px}.choice{min-height:38px;padding:8px 10px}}
</style>
</head>
<body>
<div id="game">
<img id="scene" src="Intro%20.PNG" alt="">
<div id="shade"></div>
<div id="round">ROUND 1</div>
<div id="box" class="hidden">
<div id="name"></div>
<div id="text"></div>
<div id="choices"></div>
<button id="continue" type="button">Tocca per continuare ▶</button>
</div>
<div id="start"><button id="startButton" type="button">Inizia la demo</button></div>
</div>
<script>
const imgs={
 intro:'Intro%20.PNG',
 idle:'Idle.PNG',
 attack1:'Attacco%201.PNG',
 attack2:'Attacco%202.PNG',
 attack3:'Attacco%203.PNG',
 uppercut:'Montante%20.PNG',
 down:'A%20terra%20.PNG',
 getup:'Rialzato.PNG',
 pause:'Pausa.PNG'
};
const scene=document.getElementById('scene');
const nameEl=document.getElementById('name');
const textEl=document.getElementById('text');
const choicesEl=document.getElementById('choices');
const box=document.getElementById('box');
const start=document.getElementById('start');
const startButton=document.getElementById('startButton');
const continueBtn=document.getElementById('continue');
const roundEl=document.getElementById('round');

let index=0;

const story=[
 {img:'intro',speaker:'Mika',text:'Mika aveva diciannove anni e conduceva una vita piuttosto normale. Studiava, faceva qualche lavoretto quando capitava e cercava di mettere da parte abbastanza soldi per andare a vivere da sola. Non aveva mai avuto a che fare con la boxe, se non per qualche incontro visto in televisione. Quel pomeriggio, però, aveva accettato un lavoro molto diverso dal solito: un incontro clandestino pagato in contanti.' ,next:1},
 {img:'intro',speaker:'Mika',text:'Non era stata una sua idea. Un conoscente le aveva parlato di quella palestra e della possibilità di guadagnare una somma che, per lei, faceva davvero la differenza. Mika aveva accettato pensando che avrebbe affrontato una ragazza della sua stessa esperienza. Solo dopo essere arrivata aveva scoperto la verità.',next:2},
 {img:'intro',speaker:'Mika',text:'«Mi avevano detto che avrei combattuto contro qualcuno alla mia portata…» Mika abbassa lo sguardo sui guantoni appena indossati. «Ormai sono qui. Se torno indietro senza nemmeno provarci, non mi pagheranno.»',choices:[['«Sei sicura di voler salire sul ring?»',3],['«Ti avevano detto chi avresti affrontato?»',4]]},
 {img:'intro',speaker:'Mika',text:'Mika solleva gli occhi verso di me. «No. Ma ho già accettato i soldi e ne ho bisogno. Non voglio tirarmi indietro adesso.»',next:5},
 {img:'intro',speaker:'Mika',text:'«No. Quando ho chiesto, mi hanno solo detto che sarebbe stato un incontro semplice.» Mika si guarda intorno, poi torna a fissarmi. «Se avessi saputo prima che eri un professionista, forse ci avrei pensato due volte.»',next:5},
 {img:'idle',speaker:'Luca',text:'La guardo mentre sistema i guantoni. È evidente che non è abituata a stare su un ring. Io, al contrario, combatto da anni e so bene quanto possa essere pericoloso sottovalutare qualcuno solo perché sembra inesperto.',next:6},
 {img:'idle',speaker:'Mika',text:'«Ehi… non pensare che mi arrenderò appena suona il gong. So che sei più esperto di me, ma sono venuta qui per combattere.»',choices:[['«Ti prenderò sul serio.»',7],['«Non durerai molto contro un professionista.»',8],['«Sei ancora in tempo per tirarti indietro.»',9]]},
 {img:'idle',speaker:'Luca',text:'«Va bene. Allora facciamo sul serio.» Le rivolgo un cenno e torno in guardia.',next:10},
 {img:'idle',speaker:'Mika',text:'Mika stringe i guantoni. «Lo so. Ma non sono venuta qui per chiederti di andarci piano.»',next:10},
 {img:'idle',speaker:'Mika',text:'«No.» Mika fa un respiro profondo. «Non dopo essere arrivata fin qui.»',next:10},
 {img:'idle',speaker:'Luca',text:'Il gong suona. Mika alza immediatamente la guardia e fa un piccolo passo in avanti.',next:11},
 {img:'idle',speaker:'Mika',text:'Mika si muove con cautela, cercando di capire la distanza tra noi.',choices:[['Attacca per primo',12],['Resta in guardia e osserva',13],['Lascia che sia Mika ad avvicinarsi',14]]},
 {img:'attack1',speaker:'Luca',text:'Faccio un passo avanti e provo a colpire prima che possa prendere posizione. Mika arretra appena in tempo e il mio pugno passa davanti alla sua guardia.',next:15},
 {img:'idle',speaker:'Luca',text:'Resto fermo e osservo i suoi movimenti. Mika avanza lentamente, senza scoprirsi troppo.',next:15},
 {img:'attack2',speaker:'Luca',text:'Aspetto che Mika entri nella mia distanza. Quando si avvicina, alzo la guardia e preparo la risposta.',next:15},
 {img:'idle',speaker:'Mika',text:'«Sei veloce…» Mika fa un passo di lato e torna subito in posizione.',choices:[['«Non avere fretta.»',16],['«Devi muoverti più velocemente.»',17],['«Continua così.»',18]]},
 {img:'idle',speaker:'Mika',text:'«Ci proverò.» Mika annuisce e riprende a muoversi intorno a me.',next:19},
 {img:'idle',speaker:'Mika',text:'«Lo so.» Mika inspira lentamente. «Sto cercando di capire come muovermi.»',next:19},
 {img:'idle',speaker:'Mika',text:'«Va bene.» Mika resta concentrata e solleva di nuovo la guardia.',next:19},
 {img:'idle',speaker:'Luca',text:'Mika continua a girare sul ring. Non ha la tecnica di un pugile esperto, ma non lascia cadere la guardia e cerca di non farsi chiudere all’angolo.',next:20},
 {img:'attack3',speaker:'Mika',text:'Mika parte all’improvviso con un diretto. Mi sposto di lato e il colpo sfiora il guantone.',choices:[['Schiva e cerca una risposta',21],['Chiudi la guardia',22],['Prova a colpirla mentre avanza',23]]},
 {img:'attack2',speaker:'Luca',text:'Mi sposto di lato e lascio passare il pugno. Appena Mika si gira verso di me, provo a rispondere.',next:24},
 {img:'attack2',speaker:'Luca',text:'Alzo entrambi i guantoni. Il suo pugno arriva sulla guardia e Mika torna subito indietro.',next:24},
 {img:'attack3',speaker:'Luca',text:'Provo a fermarla mentre entra. Mika riesce a evitare il colpo, ma deve arretrare per non perdere l’equilibrio.',next:24},
 {img:'idle',speaker:'Mika',text:'«Ci sono andata vicino…» Mika sorride appena, poi torna seria. «Riproverò.»',next:25},
 {img:'idle',speaker:'Luca',text:'Il ritmo aumenta. Mika continua a cercare un’apertura, mentre io cerco di non concederle spazio.',next:26},
 {img:'idle',speaker:'Mika',text:'«Stavolta non ti lascio il tempo di prepararti.» Mika avanza e porta il peso sulla gamba anteriore.',next:27},
 {img:'uppercut',speaker:'Mika',text:'Mika abbassa leggermente il corpo e parte con un montante.',choices:[['Chiudi la guardia',28],['Schiva all’indietro',29],['Resta vicino e prova a interromperla',30]]},
 {img:'uppercut',speaker:'Luca',text:'Chiudo la guardia appena in tempo. Il montante finisce sui guantoni e mi costringe comunque a fare un passo indietro.',next:31},
 {img:'attack2',speaker:'Luca',text:'Arretro rapidamente. Il guantone di Mika passa davanti a me senza colpirmi in pieno.',next:31},
 {img:'uppercut',speaker:'Luca',text:'Resto dentro lo scambio e provo a interrompere il movimento prima che possa completare il montante.',next:31},
 {img:'idle',speaker:'Mika',text:'Mika riprende fiato e sistema la guardia. «Non è facile, eh?»',next:32},
 {img:'uppercut',speaker:'Mika',text:'«Questa volta ti ho preso!» Il montante arriva prima che riesca a spostarmi completamente.',next:33},
 {img:'down',speaker:'Luca',text:'Il colpo mi sorprende. Perdo l’equilibrio e finisco a terra. Per qualche secondo sento soltanto il rumore della palestra.',next:34},
 {img:'down',speaker:'Mika',text:'Mika fa subito un passo verso di me, preoccupata. «Stai bene? Puoi rialzarti?»',next:35},
 {img:'getup',speaker:'Luca',text:'Appoggio una mano a terra e mi rialzo. Il gong non è ancora suonato.',next:36},
 {img:'getup',speaker:'Mika',text:'«Sei riuscito a rialzarti.» Mika torna in posizione e aspetta che io sia pronto.',next:37},
 {img:'idle',speaker:'Luca',text:'Torno in guardia. Il round è ancora aperto e non voglio lasciare a Mika il tempo di prendere il controllo.',next:38},
 {img:'idle',speaker:'Mika',text:'«Manca poco alla campanella.» Mika si asciuga la fronte con il guantone. «Posso ancora giocarmela.»',choices:[['Avanza e prova a chiudere bene il round',39],['Resta sulla difensiva fino alla campanella',40],['«Non pensare di aver già vinto.»',41]]},
 {img:'attack1',speaker:'Luca',text:'Avanzo e provo a riprendere il centro del ring. Mika arretra di un passo, poi torna subito avanti.',next:42},
 {img:'idle',speaker:'Luca',text:'Tengo la guardia alta e aspetto. Dopo essere finito a terra non voglio rischiare un altro colpo inutile.',next:42},
 {img:'idle',speaker:'Mika',text:'Mika mi guarda per un istante. «Non lo penso. Ma adesso so che posso metterti in difficoltà.»',next:42},
 {img:'idle',speaker:'Luca',text:'Il gong suona. Il primo round è finito. Mika abbassa lentamente i guantoni e torna verso il suo angolo.',next:43},
 {img:'idle',speaker:'Mika',text:'Mika prende fiato, ancora sorpresa di essere riuscita a reggere il primo round. «Nel prossimo round voglio fare meglio.»',next:44},
 {img:'idle',speaker:'Luca',text:'Resto qualche secondo in silenzio nel mio angolo. Quel montante mi ha ricordato che questo incontro non sarà così semplice come pensavo.',next:45},
 {img:'pause',speaker:'Luca',text:'La campanella del secondo round è ancora lontana. Abbiamo entrambi qualche minuto per riprendere fiato.',choices:[['Continua la demo',()=>location.reload()]]}
];

function render(i){
 index=i;
 const s=story[i];
 scene.src=imgs[s.img];
 nameEl.textContent=s.speaker;
 textEl.textContent=s.text;
 choicesEl.innerHTML='';
 box.classList.remove('hidden');
 roundEl.style.display=(s.img==='intro'||s.img==='pause')?'none':'block';
 continueBtn.style.display='none';
 if(s.choices){
   s.choices.forEach(([label,target])=>{
     const b=document.createElement('button');
     b.className='choice'; b.type='button'; b.textContent=label;
     b.addEventListener('click',()=>{
       if(typeof target==='function'){target();return;}
       render(target);
     });
     choicesEl.appendChild(b);
   });
 }else if(s.next!==undefined){
   continueBtn.style.display='block';
   continueBtn.onclick=()=>render(s.next);
 }
}

function begin(){start.classList.add('hidden');render(0)}
startButton.addEventListener('click',begin);
</script>
</body>
</html>
