<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Visual Novel</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#g{position:relative;width:100%;height:100dvh;max-width:900px;margin:auto;overflow:hidden}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:linear-gradient(transparent 34%,rgba(0,0,0,.8));pointer-events:none}#ui{position:absolute;left:12px;right:12px;bottom:10px;background:rgba(7,8,12,.92);border-radius:14px;padding:13px;z-index:2;max-height:50%;overflow:auto}#who{font-weight:800;color:#ffd5df;margin-bottom:6px}#tx{white-space:pre-line;line-height:1.55;font-size:15px}.ch{display:grid;gap:8px;margin-top:12px}.ch button{border:0;border-radius:10px;padding:11px;background:#f1f2f4;color:#1678c8;font-weight:700;font-size:14px;min-height:42px}#start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.12);z-index:5}#start button{border:0;border-radius:12px;padding:14px 22px;background:#f1f2f4;color:#1678c8;font-size:17px;font-weight:700}</style></head><body><div id="g"><img id="bg"><div id="shade"></div><div id="ui"><div id="who"></div><div id="tx"></div><div id="choices" class="ch"></div></div><div id="start"><button onclick="begin()">Inizia la demo</button></div></div><script>
const R={intro:'Intro .PNG',idle:'Idle.PNG',ring:'Ring.PNG',a1:'Attacco 1.PNG',a2:'Attacco 2.PNG',a3:'Attacco 3.PNG',upper:'Montante.PNG',r2:'Inizio 2 round.PNG',pause:'Pausa.PNG',watch:'La ragazza vede il nostro stato.PNG',watchP:'La ragazza vede il nostro stato (provocatoria).PNG',hit:'Colpo stordente .PNG',hitP:'Colpo stordente (provocatoria).PNG',stun:'Svenimento.PNG',down:'A terra .PNG',ko:'Ko.PNG',koP:'Ko (provocazione).PNG',fallT:'Caduta tra le gambe della ragazza.PNG',fallP:'Caduta tra le gambe della ragazza (provocazione).PNG',count:'La ragazza attende il conteggio (timida).PNG',countP:'La ragazza attende il conteggio (provocatoria).PNG',winT:'Posa della vittoria (timida).PNG',winP:'Posa della vittoria (provocatoria).PNG',near:'La ragazza che si avvicina a noi (finale timido).PNG',look:'La ragazza ci guarda dall’alto in basso (finale provocatorio).PNG',footT:'Piede poggiato (finale timido).PNG',footP:'Piede poggiato (finale provocatorio).PNG',sitT:'La ragazza che ci guarda in che stato siamo (finale timido).PNG',sitP:'Provocazione umiliante (finale provocatorio).PNG',selfT:'Selfie vittoria (timido).PNG',selfP:'Selfie vittoria (provocatorio).PNG',photoT:'Posa della foto (finale timido).PNG',photoT2:'Posa della foto2 (finale timido .PNG',photoP:'Posa della foto (finale provocatorio).PNG',exit:'Uscita dal ring.PNG',stats:'Risultati.PNG',phone:'Epilogo ragazza.PNG'};const A={};for(const k in R)A[k]=encodeURI(R[k]);const bg=document.querySelector('#bg'),who=document.querySelector('#who'),tx=document.querySelector('#tx'),cs=document.querySelector('#choices'),start=document.querySelector('#start');let prov=0;
function S(i,n,t,o=[]){bg.src=A[i]||A.idle;who.textContent=n;tx.textContent=t;cs.innerHTML='';o.forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=x[1];cs.appendChild(b)})}function Q(l,f,p=0){return[l,()=>{prov+=p;f()}]}
function begin(){start.style.display='none';S('intro','Mika',`Mika ha diciotto anni. È timida, non ha esperienza nella boxe e ha accettato l'incontro per il premio in denaro. Solo arrivata sul posto scopre che il suo avversario è un pugile professionista.

Io.

Mika stringe i guantoni. È nervosa, ma decide comunque di salire sul ring.`,[[`La osservo in silenzio.`,r1],[`Le lascio qualche secondo.`,r1],[`Cerco subito di metterle pressione.`,r1]])}
function r1(){S('ring','Luca',`Il gong suona. Mika parte cauta. Io controllo il centro e il primo round sembra andare come previsto.

Eppure noto che dopo ogni scambio lei mi osserva, come se cercasse di capire qualcosa.`,[[`Continua il round.`,idle1]])}function idle1(){S('idle','Mika',`Mika respira profondamente.

«Sei molto più sicuro di me… ma voglio almeno riuscire a restare in piedi.»

Non c'è arroganza. È soltanto sincera.

*Devo solo non farmi prendere dal panico.*`,[[`Aspetto il gong.`,pause1]])}function pause1(){S('pause','Mika',`Durante la pausa Mika beve e abbassa lo sguardo.

«Posso farcela…» mormora.

Quando rialza gli occhi, sembra un po' più determinata.`,[[`Inizia il secondo round.`,r2]])}
function r2(){S('r2','Luca',`Il secondo round comincia. Il fiato è più pesante. Mika lo nota quasi subito.

*È una principiante. Non può essere lei a dettare il ritmo.*`,[Q(`Prendo il centro.`,p1,1),Q(`Aspetto che venga avanti.`,p2,1),Q(`Cambio ritmo.`,p3,0)])}
function p1(){S('watch','Mika',`Mika arretra di mezzo passo, poi mi guarda.

«Sei stanco?»

La domanda è quasi gentile.

*Se se n'è accorta, è un problema.*`,[[`«Concentrati su di te.»`,m1],[`Non rispondo.`,m1],[`«Non pensare di aver capito tutto.»`,m1]])}function p2(){S('watch','Mika',`Mika entra nella distanza.

«Prima sembravi molto più sicuro.»

La frase non è provocatoria, ma mi pesa.

*Non dovrebbe essere lei a dirmi una cosa del genere.*`,[[`«Ti stai illudendo.»`,m1],[`Resto in guardia.`,m1],[`«Continua a provare.»`,m1]])}function p3(){S('idle','Luca',`Cambio ritmo. Mika però si sposta.

«Stavi cercando di farmi sbagliare?»

*Adesso mi sta leggendo.*`,[[`Riparto subito.`,m1],[`Osservo la sua guardia.`,m1],[`«Vieni avanti.»`,m1]])}
function m1(){S('idle','Mika',`Per alcuni secondi rimaniamo fermi.

«All'inizio pensavo solo a non farmi male. Adesso penso che posso davvero combattere.»

*Una ragazza senza esperienza mi sta dicendo che crede di poter vincere.*`,[Q(`Le lascio l'iniziativa.`,h1,1),Q(`Aspetto il suo errore.`,h2,1),Q(`Entro prima che parta.`,h3,0)])}
function h1(){S('a1','Mika',`Mika parte. Il colpo arriva sulla mia guardia e mi costringe ad arretrare.

«Ti ho fatto arretrare?» chiede sorpresa.

*Non devo lasciarle capire quanto mi abbia colpito.*`,[[`Torno avanti.`,mid],[`Mi chiudo.`,mid],[`Faccio finta di nulla.`,mid]])}function h2(){S('a2','Mika',`Aspetto troppo. Mika entra e il suo pugno mi raggiunge prima della mia risposta.

Il dolore è sopportabile.

L'umiliazione molto meno.

*Ho aspettato un errore che non è arrivato.*`,[[`Attacco subito.`,mid],[`Arretro.`,mid],[`Resto in guardia.`,mid]])}function h3(){S('a3','Mika',`Entro prima che possa muoversi. Mika reagisce d'istinto e il suo colpo mi raggiunge.

«Scusa… non volevo sorprenderti così.»

*Non voglio le sue scuse.*`,[[`«Non scusarti.»`,mid],[`Faccio spazio.`,mid],[`Torno avanti.`,mid]])}
function mid(){S(prov>=2?'watchP':'watch','Luca',`Il combattimento continua. Più passa il tempo, più diventa difficile ignorare la realtà: sto facendo fatica contro una ragazza che prima di stasera non aveva esperienza.

*Se perdo, non sarà una semplice sconfitta. Sono un professionista.*

Mika mi guarda. La sua timidezza è ancora lì, ma ora c'è sicurezza.`,[Q(`La provoco.`,branchP,2),Q(`Resto prudente.`,branchT,1),Q(`Forzo uno scambio rischioso.`,branchA,0)])}
function branchP(){S('watchP','Mika',`La provoco. Mika stringe i guantoni.

«Pensavi che sarei scappata?»

La voce è più ferma.

*Non credevo di poter parlare così con lui… ma adesso voglio vedere fin dove posso arrivare.*

Mika fa un passo avanti. Non abbassa più lo sguardo.`,[[`Continuo a provocarla.`,fightP],[`Smetto di parlare.`,fightP],[`Cerco di chiudere lo scambio.`,fightP]])}function branchT(){S('watch','Mika',`Resto prudente. Mika mi studia.

«Non voglio farti male…» dice piano.

*È quasi peggio. Non voglio la sua gentilezza. Voglio tornare a essere quello che controlla l'incontro.*`,[[`Avanzo.`,fightT],[`Aspetto.`,fightT],[`Cambio angolo.`,fightT]])}function branchA(){S('hit','Mika',`Forzo uno scambio. Mika riesce a rispondere.

«Non sei invincibile…» mormora.

*Questa volta l'ho sentita.*`,[[`Continuo.`,fightT],[`Mi copro.`,fightT],[`Arretro.`,fightT]])}
function fightT(){S('upper','Luca',`Mika avanza. Provo a rispondere, ma il suo montante arriva prima.

La testa si sposta all'indietro.

*Non può finire così.*`,[[`Resisto e continuo.`,finishT],[`Aspetto il prossimo attacco.`,finishT],[`Recupero il fiato.`,finishT]])}function fightP(){S('hitP','Mika',`Mika avanza senza più esitare.

«Adesso tocca a me.»

Il colpo mi raggiunge e perdo equilibrio.

*La ragazza che all'inizio non riusciva nemmeno a guardarmi negli occhi sta combattendo come se fosse lei quella sicura di vincere.*`,[[`Cerco di restare in piedi.`,finishP],[`La provoco ancora.`,finishP],[`Mi copro.`,finishP]])}
function finishT(){S('stun','Luca',`Le gambe diventano pesanti. Il rumore intorno sembra lontanissimo.

Mika si avvicina e si ferma.

«Ehi… tutto bene?»

La domanda è sincera. Non voglio la sua compassione.

*Non dopo tutto quello che ho costruito come professionista.*`,[Q(`Gioco tutto sull'attacco.`,win,0),Q(`Aspetto il contrattacco.`,loseT,1),Q(`Provo soltanto a resistere.`,loseT,1)])}function finishP(){S('down','Luca',`Il mio equilibrio peggiora. Mika vede in che stato sono ridotto.

Per un attimo sembra sorpresa persino lei. Poi torna in guardia.

«Non devi più dimostrarmi niente…» dice, quasi provocandomi.

*Una principiante. Sto davvero perdendo contro una principiante.*`,[Q(`Cerco un ultimo attacco.`,win,0),Q(`Aspetto che si avvicini.`,loseP,2),Q(`Mi copro e provo a resistere.`,loseP,1)])}
function win(){S('idle','Luca',`Trovo finalmente un'apertura. Riesco a chiudere lo scambio e Mika arretra.

Il gong suona.

Sono ancora in piedi.`,[[`Continua.`,statsWin]])}function statsWin(){S('stats','Statistiche',`Statistiche dell'incontro.

Vittoria di Luca.`,[[`Fine demo`,()=>{}]])}
function loseT(){S('hit','Mika',`Mika approfitta della mia esitazione. Il colpo arriva pulito.

La mia coscienza comincia a svanire.

*No… non davanti a lei.*`,[[`Continua.`,koT]])}function loseP(){S('hitP','Mika',`Mika avanza ancora.

«Guardami.»

Il colpo arriva e la mia coscienza vacilla.

*Non riesco più a reagire.*`,[[`Continua.`,koP]])}
function koT(){S('ko','Mika',`Il mondo diventa confuso. Le gambe cedono.

Mika resta immobile per qualche secondo. Guarda il mio corpo a terra e sembra quasi spaventata dalla realtà di ciò che è successo.

«Aspetta… è davvero finita?»

*L'ho battuto davvero? Io?* pensa.

Si porta una mano davanti alla bocca. Poi guarda il ring, il pubblico assente, e infine me.

«Mi dispiace… non volevo che finisse così.»

Il suo tono è sincero. La ragazza che prima aveva paura di affrontarmi ora si trova davanti a un professionista che non riesce più a rialzarsi.`,[[`Continua.`,countT]])}
function countT(){S('count','Mika',`Mika aspetta il conteggio senza esultare.

«Uno… due…»

A ogni numero spera quasi che io possa rialzarmi.

*Forse si rialza. Forse è solo stordito.*

Quando arriva l'ultimo numero, abbassa lentamente i guantoni.

«Ho vinto davvero…» sussurra.

Per qualche secondo non sa nemmeno come comportarsi. Poi sorride, ancora incredula.`,[[`Continua.`,winT]])}
function winT(){S('winT','Mika',`Mika riceve la vittoria con un sorriso timido.

«Non riesco ancora a crederci.»

Guarda verso di me.

«Sei un professionista… e io non avevo mai combattuto prima.»

Non lo dice per vantarsi. Sembra quasi chiedersi come sia stato possibile.

*Forse questa sera ho scoperto di essere più forte di quanto pensassi.*`,[[`Continua.`,nearT]])}
function nearT(){S('near','Mika',`Mika si avvicina lentamente.

«Ehi… quando ti svegli, spero che tu stia bene.»

Si ferma a poca distanza.

«Non volevo umiliarti. Volevo soltanto vincere.»

Abbassa gli occhi, imbarazzata dalla situazione.

«Però… grazie per avermi dato questa possibilità.»`,[[`Continua.`,footT]])}
function footT(){S('footT','Mika',`Mika osserva la situazione e si sente ancora a disagio.

*È strano. Fino a un'ora fa avevo paura di lui. Adesso sono io quella rimasta in piedi.*

«Non so cosa dovrei dire…» mormora.`,[[`Continua.`,sitT]])}
function sitT(){S('sitT','Mika',`Mika si siede e continua a guardarci.

«Sei davvero un professionista… eppure sono stata io a vincere.»

Sorride appena, quasi vergognandosi di ammetterlo.

«Forse dovrei essere più sicura di me, dopo questa sera.»

Poi torna seria.

«Ma non voglio che pensi che mi sto prendendo gioco di te.»`,[[`Continua.`,selfT]])}
function selfT(){S('selfT','Mika',`Più tardi Mika scatta un selfie.

Sorride in modo timido.

«Ancora non ci credo…»

Guarda la foto e pensa a quanto fosse spaventata prima dell'incontro.

*Quella ragazza ero io poche ore fa.*`,[[`Continua.`,photoT]])}
function photoT(){S('photoT','Mika',`Mika posa per la foto della vittoria.

«Forse questa la tengo.»

Poi abbassa il telefono.

«Non per vantarmi. Voglio solo ricordarmi che ce l'ho fatta.»`,[[`Continua.`,exitT]])}
function exitT(){S('exit','Mika',`Mika lascia il ring lentamente. Prima di uscire si volta un'ultima volta.

«Spero davvero che tu stia bene.»

Poi si allontana, ancora incapace di realizzare completamente quello che è successo.`,[[`Continua.`,statsLose]])}

function koP(){S('koP','Mika',`Il mondo diventa confuso e le gambe cedono.

Mika mi guarda cadere. Questa volta non c'è più la sorpresa del primo momento. C'è consapevolezza.

«Oh…» dice piano. «Sei proprio finito.»

Per qualche secondo resta in silenzio.

*All'inizio tremavo solo all'idea di affrontarlo. Adesso è lui che non riesce nemmeno a guardarmi.*

Un sorriso le compare lentamente sul volto.

«Non pensavo che sarebbe andata così.»`,[[`Continua.`,countP]])}
function countP(){S('countP','Mika',`Mika aspetta il conteggio senza distogliere gli occhi da me.

«Uno… due… tre…»

A metà conteggio si accorge che non mi sto rialzando.

«Quattro… cinque…»

Il sorriso diventa più evidente.

*Davvero un professionista sta per perdere contro di me?* 

«Sette… otto… nove… dieci.»

Mika abbassa i guantoni.

«È finita.»

Poi inclina appena la testa.

«E pensare che all'inizio avevi tutta quella sicurezza.»`,[[`Continua.`,winP]])}
function winP(){S('winP','Mika',`Mika posa per la vittoria. Non è più la ragazza esitante dell'inizio.

«Alla fine sei stato tu a cadere.»

Sorride.

«Quando sono salita sul ring pensavo che avrei dovuto solo sopravvivere. Poi ho capito che potevo metterti in difficoltà.»

Fa una breve pausa.

«E quando ti ho visto vacillare… ho capito che potevo davvero vincere.»

*Forse non dovrei essere così soddisfatta. Ma è difficile non esserlo.*`,[[`Continua.`,lookP]])}
function lookP(){S('look','Mika',`Mika si avvicina e ci guarda dall'alto in basso.

«Sai qual è la cosa più incredibile?»

Aspetta qualche secondo.

«Che io avevo paura di te.»

Il suo sorriso si allarga.

«Adesso invece mi chiedo perché fossi così preoccupata.»

*È strano quanto sia cambiata la situazione in una sola serata.*

«Non prendertela. Sei stato tu a sottovalutarmi.»`,[[`Continua.`,footP]])}
function footP(){S('footP','Mika',`Mika guarda la scena con una sicurezza ormai evidente.

«Una principiante, eh?» dice sottovoce.

Ride appena.

«Quella frase me la ricorderò.»

*Non avrei mai pensato di poter parlare così dopo un combattimento.*

Poi guarda ancora verso di me.

«Dovrai ammettere che ti ho sorpreso.»`,[[`Continua.`,sitP]])}
function sitP(){S('sitP','Mika',`Mika si siede e ci osserva per qualche secondo.

«È incredibile.»

Fa una pausa.

«Poche ore fa ero convinta che sarei stata io quella umiliata. E invece sei tu quello che non riesce nemmeno a rialzarsi.»

Il tono è provocatorio, ma non urlato.

*Forse sto esagerando. Ma dopo tutto quello che mi ha fatto sentire all'inizio… voglio godermi almeno un po' questa vittoria.*

«Non dimenticherò questa serata.»`,[[`Continua.`,selfP]])}
function selfP(){S('selfP','Mika',`Mika prende il telefono e scatta un selfie.

Sorride senza più nascondere la soddisfazione.

«Questa me la voglio ricordare.»

Controlla la foto.

«Perfetta.»

*La ragazza che tremava prima del gong adesso sta sorridendo davanti alla foto della sua vittoria contro un professionista.*

«Non credo che nessuno mi avrebbe creduto se glielo avessi raccontato.»`,[[`Continua.`,photoP]])}
function photoP(){S('photoP','Mika',`Mika posa per la foto della vittoria.

«Questa è quella che tengo.»

Sistema i capelli e guarda la foto.

«Non solo perché ho vinto. Perché dimostra che non ero così debole come pensavo.»

Poi sorride di nuovo.

«E forse perché voglio ricordarti che mi avevi sottovalutata.»`,[[`Continua.`,exitP]])}
function exitP(){S('exit','Mika',`Mika scende dal ring con un'espressione soddisfatta.

Prima di uscire si volta verso di noi.

«Riprenditi.»

Fa una breve pausa e sorride.

«E la prossima volta… non chiamare principiante qualcuno che non hai ancora affrontato.»

Poi esce dal ring.

*Non so se questa sicurezza durerà. Ma stasera non voglio nasconderla.*`,[[`Continua.`,statsLose]])}
function statsLose(){S('stats','Statistiche',`Statistiche dell'incontro.

Vittoria di Mika.`,[[`Continua.`,phone]])}
function phone(){S('phone','Mika',`Più tardi, a casa, Mika è al telefono con la sua amica.

«Non ci crederai mai. Ho davvero vinto.»

Ascolta la risposta e ride.

«Sì, lo so. Sembra assurdo anche a me.»

Fa una pausa.

«Era un professionista. Io non avevo mai combattuto seriamente.»

Sorride guardando le foto sul telefono.

«All'inizio avevo una paura tremenda. Poi qualcosa è cambiato.»

Abbassa la voce.

«Quando l'ho visto in difficoltà… ho capito che potevo farcela.»

Resta in silenzio per un momento.

«Comunque spero che stia bene.»`,[[`Continua.`,hospital]])}
function hospital(){S('idle','',`Quando riapro gli occhi vedo un soffitto bianco.

Per qualche secondo non ricordo dove sono. Poi tornano il ring, il gong e l'ultimo scambio.

Sono in ospedale.

La parte più difficile non è il dolore.

È ricordare contro chi ho perso.

Una ragazza che era salita sul ring senza esperienza.

Una ragazza che, all'inizio, aveva paura di me.

E alla fine ero io quello che non riusciva più a stare in piedi.

*Non dimenticherò facilmente questa notte.*

FINE DEMO — SCONFITTA`,[[`Ricomincia`,()=>location.reload()]])}
</script></body></html>
